name: test-selloq

x-mcp-env: &mcp-env
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: test-selloq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-selloq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-selloq}
      POSTGRES_DB: ${POSTGRES_DB:-selloq}
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-selloq} -d ${POSTGRES_DB:-selloq}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: test-selloq-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mcp-webscraper:
    <<: *mcp-env
    build: ./mcp/webscraper
    container_name: test-selloq-mcp-webscraper
    expose: ["9001"]

  mcp-docparser:
    <<: *mcp-env
    build: ./mcp/docparser
    container_name: test-selloq-mcp-docparser
    expose: ["9002"]

  mcp-signals:
    <<: *mcp-env
    build: ./mcp/signals
    container_name: test-selloq-mcp-signals
    expose: ["9003"]

  demo-sites:
    image: nginx:alpine
    container_name: test-selloq-demo-sites
    volumes: ["./demo/sites:/usr/share/nginx/html:ro"]
    ports: ["8080:80"]

  mailpit:
    image: axllent/mailpit:latest
    container_name: test-selloq-mailpit
    ports: ["8025:8025"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: test-selloq-backend
    container_name: test-selloq-backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: [uploads:/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mcp-webscraper: { condition: service_started }
      mcp-docparser: { condition: service_started }
      mcp-signals: { condition: service_started }
      demo-sites: { condition: service_started }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: test-selloq-backend
    container_name: test-selloq-worker
    env_file: .env
    command: arq app.worker.WorkerSettings
    volumes: [uploads:/data/uploads]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: test-selloq-frontend
    ports: ["5173:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata: {}
  uploads: {}
